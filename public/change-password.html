<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changer le mot de passe</title><link rel="stylesheet" href="css/bootstrap.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#eef5f0;font-family:Arial}.box{width:min(440px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 15px 45px #0002;border-left:6px solid #2fa35a}.box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd8cf;border-radius:8px}.box button{width:100%;padding:12px;border:0;border-radius:8px;background:#2fa35a;color:#fff;font-weight:800}</style></head><body><script src="js/admin-auth.js"></script><main class="box"><h2>Créer votre nouveau mot de passe</h2><p>Un administrateur exige le remplacement de votre mot de passe temporaire.</p><input id="password" type="password" placeholder="Nouveau mot de passe (10 caractères minimum)" autocomplete="new-password"><input id="confirm" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password"><button onclick="changePassword()">Enregistrer</button></main><script>async function changePassword(){const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value)return alert('Les mots de passe ne correspondent pas.');const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const j=await r.json().catch(()=>({}));if(!r.ok)return alert('❌ '+(j.error||'Erreur'));alert('✅ Mot de passe modifié.');location.replace('admin.html');}</script></body></html>
