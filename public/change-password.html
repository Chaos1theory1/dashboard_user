<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sécurité du compte — Mycelium Tech Digital</title>
  <link rel="icon" href="images/logo-agro.jpeg" type="image/jpeg">
  <style>
    .password-page{max-width:760px;margin:0 auto;padding:24px 18px 48px}.password-card{padding:24px;border:1px solid #e2e9e3;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(18,48,28,.07)}.password-card h2{margin:0 0 7px;font-size:20px}.password-card p{margin:0 0 18px;color:#6f7d73;font-size:12px;line-height:1.55}.password-grid{display:grid;gap:12px}.password-card label{display:block;margin-bottom:5px;color:#46544a;font-size:11px;font-weight:700}.password-card input{width:100%;padding:11px;border:1px solid #d5e0d8;border-radius:10px}.password-card button{margin-top:4px;padding:11px 14px;border:0;border-radius:10px;background:#2f9f57;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <script src="js/admin-auth.js"></script>
  <main class="password-page">
    <section class="password-card">
      <h2>Nouveau mot de passe</h2>
      <p>Votre mot de passe temporaire doit être remplacé avant de poursuivre l’utilisation de l’application.</p>
      <div class="password-grid"><label>Nouveau mot de passe<input id="password" type="password" placeholder="10 caractères minimum" autocomplete="new-password"></label><label>Confirmation<input id="confirm" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password"></label><button type="button" onclick="changePassword()">Enregistrer le nouveau mot de passe</button></div>
    </section>
  </main>
  <script>
    async function changePassword(){const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value)return alert('Les mots de passe ne correspondent pas.');const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'Erreur');alert('Mot de passe modifié.');location.replace('admin.html');}
  </script>
</body>
</html>
